# Apache reverse proxy in front of the Next.js server on 127.0.0.1:3000.
# Install to /etc/apache2/sites-available/vss-event.conf, then:
#   sudo a2ensite vss-event && sudo apache2ctl configtest && sudo systemctl reload apache2
#   sudo certbot --apache -d vastrasidan.se -d www.vastrasidan.se
# certbot adds the :443 vhost (vss-event-le-ssl.conf) with the same proxy settings.
#
# Swap ServerName to a staging host (e.g. next.vastrasidan.se) to try it before moving DNS.

<VirtualHost *:80>
    ServerName vastrasidan.se
    ServerAlias www.vastrasidan.se
    ErrorLog ${APACHE_LOG_DIR}/vss-event-error.log
    CustomLog ${APACHE_LOG_DIR}/vss-event-access.log combined

    # www is canonical, as it was on Vercel
    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^vastrasidan\.se$ [NC]
    RewriteRule ^ https://www.vastrasidan.se%{REQUEST_URI} [R=308,L]

    ProxyPreserveHost On
    ProxyTimeout 60
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}
    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    # Hashed build assets never change
    <LocationMatch "^/_next/static/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
</VirtualHost>
