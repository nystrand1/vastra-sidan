# Apache reverse proxy for staging, in front of vss-staging on 127.0.0.1:3001.
# Install to /etc/apache2/sites-available/vss-staging.conf, then:
#   sudo a2ensite vss-staging && sudo apache2ctl configtest && sudo systemctl reload apache2
#   sudo certbot --apache -d staging.event.vastrasidan.se
# certbot adds the :443 vhost (vss-staging-le-ssl.conf) with the same settings.

<VirtualHost *:80>
    ServerName staging.event.vastrasidan.se
    ErrorLog ${APACHE_LOG_DIR}/vss-staging-error.log
    CustomLog ${APACHE_LOG_DIR}/vss-staging-access.log combined

    # Keep staging out of search results
    Header always set X-Robots-Tag "noindex, nofollow"

    ProxyPreserveHost On
    ProxyTimeout 60
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}
    ProxyPass / http://127.0.0.1:3001/
    ProxyPassReverse / http://127.0.0.1:3001/

    <LocationMatch "^/_next/static/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
</VirtualHost>
